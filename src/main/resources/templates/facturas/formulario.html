<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>TechRepair | Nueva Orden</title>
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><span class="nav-link" th:text="'Técnico: ' + ${session.nombreUsuario}"></span></li>
            <li class="nav-item"><a th:href="@{/logout}" class="nav-link text-danger"><i class="fas fa-power-off"></i></a></li>
        </ul>
    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/dashboard}" class="brand-link"><span class="brand-text font-weight-light">TECHREPAIR ERP</span></a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column">
                    <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li class="nav-item"><a th:href="@{/clientes}" class="nav-link"><i class="nav-icon fas fa-users"></i> Clientes</a></li>
                    <li class="nav-item"><a th:href="@{/productos}" class="nav-link"><i class="nav-icon fas fa-microchip"></i> Productos</a></li>
                    <li class="nav-item"><a th:href="@{/servicios}" class="nav-link"><i class="nav-icon fas fa-tools"></i> Servicios</a></li>
                    <li class="nav-item"><a th:href="@{/facturas}" class="nav-link active"><i class="nav-icon fas fa-file-invoice-dollar"></i> Facturación</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <div class="content-wrapper">
        <section class="content-header"><h1>Generar Nueva Orden</h1></section>
        <section class="content">
            <div class="card card-success">
                <form th:action="@{/facturas/guardar}" th:object="${factura}" method="post">
                    <div class="card-body">
                        <div class="form-group">
                            <label>Cliente</label>
                            <select th:field="*{clienteNombre}" class="form-control" required>
                                <option value="">-- Elige al cliente --</option>
                                <option th:each="c : ${clientes}" th:value="${c.nombre}" th:text="${c.nombre}"></option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6"><label>¿Es Producto?</label>
                                <select id="selP" class="form-control"><option value="" data-precio="0">-- No --</option>
                                    <option th:each="p : ${productos}" th:value="${p.nombre}" th:data-precio="${p.precio}" th:text="${p.nombre}"></option>
                                </select>
                            </div>
                            <div class="col-md-6"><label>¿Es Servicio?</label>
                                <select id="selS" class="form-control"><option value="" data-precio="0">-- No --</option>
                                    <option th:each="s : ${servicios}" th:value="${s.nombre}" th:data-precio="${s.precio}" th:text="${s.nombre}"></option>
                                </select>
                            </div>
                        </div>
                        <hr>
                        <div class="form-group"><label>Concepto</label><input type="text" th:field="*{itemNombre}" id="fNom" class="form-control" readonly required></div>
                        <div class="row">
                            <div class="col-6"><label>Cantidad</label><input type="number" th:field="*{cantidad}" id="fCan" class="form-control" value="1" min="1"></div>
                            <div class="col-6"><label>Total ($)</label><input type="number" step="0.01" th:field="*{total}" id="fTot" class="form-control" readonly required style="font-weight:bold; color:green;"></div>
                        </div>
                    </div>
                    <div class="card-footer"><button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Generar Orden</button></div>
                </form>
            </div>
        </section>
    </div>
</div>
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>
<script>
    const selP = document.getElementById('selP'), selS = document.getElementById('selS'), fNom = document.getElementById('fNom'), fTot = document.getElementById('fTot'), fCan = document.getElementById('fCan');
    let pU = 0;
    function up() { fTot.value = (pU * fCan.value).toFixed(2); }
    selP.addEventListener('change', function() { if(this.value) { selS.value=""; fNom.value=this.value; pU=this.options[this.selectedIndex].getAttribute('data-precio'); up(); } });
    selS.addEventListener('change', function() { if(this.value) { selP.value=""; fNom.value=this.value; pU=this.options[this.selectedIndex].getAttribute('data-precio'); up(); } });
    fCan.addEventListener('input', up);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>TechRepair | Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&amp;display=fallback">
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <span class="nav-link" th:text="'Usuario: ' + ${session.nombreUsuario}"></span>
            </li>
            <li class="nav-item">
                <a th:href="@{/logout}" class="nav-link text-danger"><i class="fas fa-power-off"></i></a>
            </li>
        </ul>
    </nav>

    <!-- Menú Lateral TechRepair -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/dashboard}" class="brand-link">
            <span class="brand-text font-weight-light">TECHREPAIR ERP</span>
        </a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column">
                    <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link active"><i class="nav-icon fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li class="nav-item"><a th:href="@{/clientes}" class="nav-link"><i class="nav-icon fas fa-users"></i> Clientes</a></li>
                    <li class="nav-item"><a th:href="@{/productos}" class="nav-link"><i class="nav-icon fas fa-microchip"></i> Productos</a></li>
                    <li class="nav-item"><a th:href="@{/servicios}" class="nav-link"><i class="nav-icon fas fa-tools"></i> Servicios</a></li>
                    <li class="nav-item"><a th:href="@{/facturas}" class="nav-link"><i class="nav-icon fas fa-file-invoice-dollar"></i> Facturación</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Contenido Central -->
    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid"><h1>Resumen del Taller</h1></div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-3 col-6">
                        <div class="small-box bg-indigo">
                            <div class="inner"><h3 th:text="${numClientes != null ? numClientes : 0}">0</h3><p>Clientes</p></div>
                            <div class="icon"><i class="fas fa-users"></i></div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-6">
                        <div class="small-box bg-teal">
                            <div class="inner"><h3 th:text="${numProductos != null ? numProductos : 0}">0</h3><p>Productos</p></div>
                            <div class="icon"><i class="fas fa-microchip"></i></div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-6">
                        <div class="small-box bg-orange">
                            <div class="inner"><h3 th:text="${numServicios != null ? numServicios : 0}">0</h3><p>Servicios</p></div>
                            <div class="icon"><i class="fas fa-tools"></i></div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-6">
                        <div class="small-box bg-maroon">
                            <div class="inner"><h3 th:text="'$' + ${ingresos != null ? ingresos : 0.0}">0.0</h3><p>Ingresos Totales</p></div>
                            <div class="icon"><i class="fas fa-cash-register"></i></div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <div class="card card-dark card-outline">
                            <div class="card-header"><h3 class="card-title"><i class="far fa-chart-bar"></i> Distribución de Registros</h3></div>
                            <div class="card-body">
                                <canvas id="miGrafica" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/plugins/chart.js/Chart.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>

<script th:inline="javascript">
    $(function () {
        var ctx = document.getElementById('miGrafica').getContext('2d');
        var c = [[${numClientes != null ? numClientes : 0}]];
        var p = [[${numProductos != null ? numProductos : 0}]];
        var s = [[${numServicios != null ? numServicios : 0}]];

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Clientes', 'Productos', 'Servicios'],
                datasets: [{
                    label: 'Registros',
                    data: [c, p, s],
                    backgroundColor: ['#6610f2', '#20c997', '#fd7e14'],
                    borderWidth: 0
                }]
            },
            options: {
                maintainAspectRatio: false,
                responsive: true,
                legend: { display: false },
                scales: { yAxes: [{ ticks: { beginAtZero: true } }] }
            }
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>TechRepair | Servicio</title>
    <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><span class="nav-link" th:text="'Técnico: ' + ${session.nombreUsuario}"></span></li>
            <li class="nav-item"><a th:href="@{/logout}" class="nav-link text-danger"><i class="fas fa-power-off"></i></a></li>
        </ul>
    </nav>

    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/dashboard}" class="brand-link"><span class="brand-text font-weight-light">TECHREPAIR ERP</span></a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column">
                    <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li class="nav-item"><a th:href="@{/clientes}" class="nav-link"><i class="nav-icon fas fa-users"></i> Clientes</a></li>
                    <li class="nav-item"><a th:href="@{/productos}" class="nav-link"><i class="nav-icon fas fa-microchip"></i> Productos</a></li>
                    <li class="nav-item"><a th:href="@{/servicios}" class="nav-link active"><i class="nav-icon fas fa-tools"></i> Servicios</a></li>
                    <li class="nav-item"><a th:href="@{/facturas}" class="nav-link"><i class="nav-icon fas fa-file-invoice-dollar"></i> Facturación</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <div class="content-wrapper">
        <section class="content-header">
            <h1 th:text="${servicio.id == null ? 'Nuevo Servicio' : 'Editar Servicio'}"></h1>
        </section>
        <section class="content">
            <div class="card card-warning">
                <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="card-body">
                        <div class="form-group" th:if="${servicio.id != null}"><label>ID</label><input type="text" class="form-control" th:value="${servicio.id}" disabled></div>
                        <div class="form-group"><label>Servicio</label><input type="text" th:field="*{nombre}" class="form-control" required></div>
                        <div class="form-group"><label>Descripción</label><textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea></div>
                        <div class="form-group"><label>Precio ($)</label><input type="number" step="0.01" th:field="*{precio}" class="form-control" required></div>
                    </div>
                    <div class="card-footer">
                        <button type="submit" class="btn btn-warning"><i class="fas fa-save"></i> Guardar</button>
                        <a th:href="@{/servicios}" class="btn btn-default float-right">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>
</body>
</html>
